name: partidou

services:
  app:
    image: partidou:atual
    container_name: partidou
    restart: unless-stopped
    init: true
    # uid sem conta no host: só o container acessa o banco e os logs.
    user: "10791:10791"
    # Só o loopback: a exposição HTTPS é do túnel da Cloudflare.
    ports:
      - "127.0.0.1:8791:8791"
    environment:
      HOST: 0.0.0.0
      PORT: "8791"
      DB_PATH: /dados/partidou.db
      LOG_DIR: /logs
      TRUST_PROXY: cloudflare
      # Gateway da rede abaixo: é o endereço de origem que o container enxerga no tráfego do túnel.
      PROXY_CONFIAVEL: 172.29.91.1
      # Heap e limite sobem juntos: o GET /estado de uma resenha cheia (5000 partidas) chega a ~2 MB.
      NODE_OPTIONS: --max-old-space-size=160
    volumes:
      - ./data:/dados
      - ./logs:/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8791/saude || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.91.0/24
          gateway: 172.29.91.1
