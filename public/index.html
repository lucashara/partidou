      THESIS: súmula de jogo contemporânea. O placar é o campo preenchido de um formulário, não um painel; recusa o painel LED escuro com um neon.
      OWN-WORLD: folha branca ou carbono azul-noite, campos de traço fino com rótulo no canto, tinta azul de esferográfica nos números, cartão amarelo como única ação e cartão vermelho para excluir; Barlow e Barlow Condensed.
      STORY: quem jogou registra em poucos toques, vê o histórico por dia e confia que todos os aparelhos mostram a mesma folha.
      FIRST VIEWPORT: cabeçalho com nome da resenha e estado de sincronização; folha com dois lados, números de 88 a 128 px com botões de passo; botão "Lançar partida" amarelo ao alcance do polegar.
      FORM: sétimo candidato da lista própria (súmula da várzea), seed 6d1b9f0c.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->

      <header class="topo" id="topo"></header>

      <main class="principal" id="principal" tabindex="-1"></main>
